<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definição da Paleta de Cores e Iluminação -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#efcc7a" />
      <stop offset="100%" stop-color="#c69d4a" />
    </linearGradient>
  </defs>
  
  <!-- Tela de Fundo (Charcoal/Grafite Profundo) -->
  <rect width="512" height="512" fill="#151515" />
  
  <g fill="url(#goldGradient)">
    <!-- Composição das Colunas Ascendentes -->
    <rect x="131" y="230" width="40" height="80" />
    <rect x="201" y="160" width="40" height="150" />
    <rect x="271" y="90" width="40" height="220" />
    <rect x="341" y="20" width="40" height="290" />
    
    <!-- Base Sólida (Alinhada geometricamente) -->
    <rect x="106" y="290" width="300" height="110" rx="16" />
  </g>
  
  <!-- Demarcação/Recorte (Escultura no espaço negativo) -->
  <rect x="216" y="365" width="80" height="18" rx="9" fill="#151515" />
</svg>
